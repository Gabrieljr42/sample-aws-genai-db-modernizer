# Pattern substring-match. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
#
# An unindexed substring match (#493, maintainer decision of 2026-10-16, option C): a LIKE
# whose literal pattern starts with % (LIKE '%x', LIKE '%' + @t + '%', CONCAT('%', ?, '%')).
# A B-tree index cannot serve it, so it needs an index built for substrings: Aurora
# PostgreSQL has one (pg_trgm) and OpenSearch serves it natively. Aurora MySQL and
# DocumentDB do not: they run it, but only as a scan of every row. That is a capability
# they lack (ADR-031 Decision 2 step 5), so they are `scan` entries, and they lose the
# penalty only when the scan matters (scan_threshold). A word search ('%word%' on a text
# column) is never penalised: it gets each engine's word-search redesign as guidance.
# A parameterised pattern (LIKE $1) is not this pattern: its value is unknown (#912).
id = "substring-match"
detectors = [
    "src.agents.referee.substring_match:substring_matches",
]
capability = "substring_index"
# Points a scan engine loses on a query that crosses scan_threshold: half of
# wildcard-search's 40, the same half the catalog's reduced penalties take (wide-transaction
# 10 of acid-transactions' 20). A scan is slower, not impossible.
penalty = 20

[scan_threshold]
min_calls_per_second = 1.0
min_table_rows = 100000
why = "A leading-wildcard LIKE reads every row of the table (MySQL Reference Manual, Comparison of B-Tree and Hash Indexes: a B-tree serves LIKE only for a constant pattern that does not start with a wildcard). At 1 call per second on 100,000 rows that is 100,000 rows read every second, the point where the analysis cost bands (src/tools/analysis/scoring.py) stop calling a query rare and a table small; below either, the scan is cheap enough to keep."

# The why of each entry is a verb phrase: the code puts the engine's display name in front
# of it (display_engine), so no engine name is written here.
[engines.aurora_postgresql]
kind = "native"
supported = true
why = "indexes a leading-wildcard LIKE with a pg_trgm trigram index (GIN or GiST), an extension to create (the PostgreSQL documentation of pg_trgm describes its index support for LIKE and ILIKE)."
guidance = "create the pg_trgm extension and a GIN trigram index on the column (CREATE EXTENSION pg_trgm), which serves this LIKE, word searches included; full-text search (to_tsvector) also ranks word matches."

[engines.opensearch]
kind = "native"
supported = true
why = "serves a leading-wildcard match natively, with wildcard queries or an n-gram analyzer on the field."

[engines.aurora_mysql]
kind = "scan"
supported = true
why = "scans a leading-wildcard LIKE: FULLTEXT indexes are word-based and serve MATCH ... AGAINST, never LIKE (MySQL Reference Manual, Full-Text Search Functions)."
guidance = "rewrite it as MATCH ... AGAINST over a FULLTEXT index on the column, which serves word search."

[engines.documentdb]
kind = "scan"
supported = true
why = "runs a leading-wildcard LIKE as an unanchored $regex, which reads every document; a text index serves word search with $text."
guidance = "create a text index on the field and query it with $text, which serves word search."

[engines.dynamodb]
kind = "unscored"
supported = false
why = "is ruled out of a leading-wildcard LIKE before scoring, by the hard exclusion ddb-no-leading-wildcard."

[engines.elasticache]
kind = "unscored"
supported = false
why = "does not run a LIKE at all; its analysis does not report this pattern."

[engines.neptune]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"

[engines.keyspaces]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"
