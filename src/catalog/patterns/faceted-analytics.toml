# Pattern faceted-analytics. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "faceted-analytics"
detectors = [
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
penalty = 0
penalty_basis = "guidance_only"

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection signals: multi-dimensional GROUP BY / HAVING with multiple aggregation axes
[engines.documentdb]
kind = "anti_pattern"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-anti-06"
severity = 0.5
why = "GROUP BY over several columns with an aggregate. $group with a compound _id serves it natively; real faceting ($facet, several groupings of one filtered set) needs DocumentDB 8.0.2 or later on an instance-based cluster, and this detector does not find it (Amazon DocumentDB Developer Guide, Supported MongoDB APIs, operations, and data types)."
guidance = "Run multiple aggregation pipelines in parallel at application layer."

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.aurora_postgresql]
