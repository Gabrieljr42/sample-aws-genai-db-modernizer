# Pattern product-catalog. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "product-catalog"
detectors = [
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection (#920): a key lookup or key-scoped SELECT of a typed entity (a discriminator
# column such as category or type) that has a JSON column
# (src/tools/analysis/variant_attributes.py, TYPED_DOCUMENT). Column count and nullability
# are not evidence.
[engines.documentdb]
kind = "fit"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-02"
score = 85
why = "A typed entity (category or type) whose variable attributes are a JSON column, read by its key: DocumentDB stores each entity as one flexible document of up to 16 MB with only its own fields; it has no wildcard index, so each queried attribute needs its own index (Amazon DocumentDB Developer Guide, Quotas and limits; Functional differences)."
concerns = [
    "Wildcard indexes ($**) not supported — create targeted indexes per queryable attribute",
]
table_bonus = 10

