# Pattern polymorphic-data. Fields: src/shared/catalog/patterns.py (ADR-031 Decision 8).
id = "polymorphic-data"
detectors = [
    "src.tools.analysis.documentdb_analysis_tools:analyze_documentdb_use_cases",
]
penalty = 0

[engines.dynamodb]
kind = "unscored"
supported = true
why = "DynamoDB's analysis does not report this pattern; it adds no cross-engine penalty."

# Detection (#920): a key lookup or key-scoped SELECT that reads an entity-attribute-value
# table with its entity column pinned or joined, one entity's attribute set
# (src/tools/analysis/variant_attributes.py, ATTRIBUTE_ROWS). Nullable columns are not
# sparseness, and the collector reports no null fraction.
[engines.documentdb]
kind = "fit"
supported = true
catalog = "documentdb"
catalog_id = "documentdb-03"
score = 80
why = "One entity's attribute rows (an entity-attribute-value table) read by the entity's key: DocumentDB stores the attributes as fields of the entity's own document, up to 16 MB, with only the fields it has; it has no wildcard index, so each queried attribute needs its own index (Amazon DocumentDB Developer Guide, Quotas and limits; Functional differences)."
concerns = [
    "Wildcard indexes ($**) not supported in any DocumentDB version — flatten queryable attributes to top-level with targeted compound indexes",
]
# Schema flexibility reduces migration complexity.
complexity_feature = true

[engines.opensearch]
kind = "unscored"
supported = true
why = "OpenSearch's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.elasticache]
kind = "unscored"
supported = true
why = "ElastiCache's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.aurora_postgresql]
kind = "unscored"
supported = true
why = "Aurora PostgreSQL's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.aurora_mysql]
kind = "unscored"
supported = true
why = "Aurora MySQL's analysis does not report this pattern; it adds no cross-engine penalty."

[engines.neptune]
kind = "future"
supported = false
why = "Not modelled yet (future enhancement)"

[engines.keyspaces]
kind = "future"
